<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mzansi Farmer AI</title>
<meta name="description" content="AI suggests irrigation, OpenEdge rules check it, the farmer approves. Example data only.">
<meta name="theme-color" content="#0E3626">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Main">
    <div class="logo"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg>MZANSI FARMER</div>
    <nav id="sidenav"></nav>
    <div class="farmer" id="farmer-card"></div>
    <button class="logout" id="logout" data-act="logout" type="button"></button>
  </aside>
  <div class="main">
    <header class="top" id="top"></header>
    <div class="ai-note" id="ai-note" role="note" hidden></div>
    <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
  </div>
  <nav class="pillnav" id="tabbar" aria-label="Main"></nav>
</div>
<div id="overlay"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
