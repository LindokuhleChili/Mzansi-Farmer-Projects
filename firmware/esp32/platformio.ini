; ESP32 sensor feed for Mzansi Farmer AI
; Build/upload:  pio run -e esp32dev -t upload     Monitor: pio device monitor
; Unit tests:    pio test -e native   (host only, no hardware needed)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags = -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Wall -Wextra
lib_ldf_mode = deep+
